<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DLIR Industrial Relations and Reporting</title><link rel="icon" href="/favicon.svg">
<style>
:root{font-family:Arial,sans-serif;color:#172c3f;background:#eef3f7}body{margin:0}header{background:#143750;color:white;padding:22px 4vw;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0 0 6px}h2{font-size:21px}h3{font-size:17px;margin-top:28px}header p{margin:0;color:#b9d3e3}.layout{max-width:1450px;margin:auto;padding:24px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}button,.button{background:#145b82;color:white;border:0;padding:11px 16px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block;font-size:14px}nav button{background:white;color:#143750;border:1px solid #bed0dc}nav button.active{background:#143750;color:white}section,.panel{background:white;padding:22px;border:1px solid #d8e2e9;border-radius:9px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{background:#f2f6fa;border-left:4px solid #247da9;padding:18px}.stat strong{font-size:30px;display:block;margin-bottom:5px}label{display:block;font-size:14px;font-weight:bold;margin:10px 0 6px}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #afc4d2;border-radius:4px;font:inherit;background:white}textarea{min-height:90px}form button{margin-top:15px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:12px 9px;text-align:left;border-bottom:1px solid #d8e2e9;vertical-align:top}th{background:#eaf1f6;white-space:nowrap}td{max-width:330px;overflow-wrap:anywhere}.scroll{overflow:auto}small,.muted{color:#526c7e}a{color:#145b82}.error{color:#aa202c;padding:12px;background:#fff0f1}.success{padding:12px;background:#e7f6ef;color:#145c3c}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.row>div{flex:1;min-width:150px}.hidden{display:none!important}#auth{max-width:480px;margin:40px auto}.notice{font-size:14px;line-height:1.55;padding:14px;background:#f4f7fa;border-radius:5px;margin:15px 0}pre{white-space:pre-wrap;max-height:300px;overflow:auto;font-size:13px}details{margin:12px 0}summary{cursor:pointer}footer{font-size:13px;color:#526c7e;margin-top:18px}
@media(max-width:650px){header{display:block;padding:18px}#identity{margin-top:15px}.layout{padding:12px}section{padding:16px}.grid{grid-template-columns:1fr}nav button{flex:1;min-width:125px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
<header><div><h1>DLIR Matters and Reporting</h1><p>Shared case register · Workplan implementation · Departmental reports</p></div><div id="identity"></div></header>
<div class="layout"><div id="message" role="status"></div>
<div id="app" class="hidden"><div class="row" style="margin-bottom:20px"><div><label>Organisational unit</label><select id="unit"></select></div><div><label>Reporting year</label><input type="number" id="year" value="2026" min="2000" max="2100"></div><div><label>Reporting period</label><select id="quarter"><option value="1">Q1 · January–March</option><option value="2">Q2 · April–June</option><option value="3">Q3 · July–September</option><option value="4">Q4 · October–December</option><option value="0">Annual · January–December</option></select></div></div>
<nav id="nav"></nav><div id="view"></div><footer>Records and documents are saved in departmental cloud storage. Refresh to see recent staff updates. Approved snapshots retain the report as reviewed.</footer></div></div>
<script src="/application.js"></script></html>
